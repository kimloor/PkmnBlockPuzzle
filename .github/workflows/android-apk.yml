name: Android Release APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/build-requests/request.json'

permissions:
  contents: write

jobs:
  android-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: TetrisApp
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: TetrisApp/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify release secrets without printing values
        shell: bash
        run: |
          set -euo pipefail
          for k in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            test -n "${!k}" || { echo "::error::Missing required signing secret: $k"; exit 1; }
          done
      - name: Install dependencies
        run: npm ci
      - name: Install Cordova
        run: npm install --global cordova@12
      - name: Add Android platform
        run: cordova platform add android@14.0.1
      - name: Install external browser bridge
        run: cordova plugin add cordova-plugin-inappbrowser@6.0.0
      - name: Install in-app updater
        run: |
          test -f local-plugins/cordova-plugin-pkmn-updater/package.json
          test -f local-plugins/cordova-plugin-pkmn-updater/plugin.xml
          cordova plugin add ./local-plugins/cordova-plugin-pkmn-updater
      - name: Verify Android updater resource placement
        shell: bash
        run: |
          set -euo pipefail
          resource="platforms/android/app/src/main/res/xml/pkmn_updater_paths.xml"
          source="local-plugins/cordova-plugin-pkmn-updater/src/android/pkmn_updater_paths.xml"
          test -s "$source"
          mkdir -p "$(dirname "$resource")"
          cp "$source" "$resource"
          test -s "$resource"
          echo "Updater FileProvider XML present at: $resource"
      - name: Validate version and authorized build request
        id: release_version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("config.xml").getroot().attrib["version"])')"
          code="$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("config.xml").getroot().attrib["android-versionCode"])')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$code" =~ ^[0-9]+$ ]]
          grep -Fq "v$version</div>" www/index.html
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            requested="$(python3 -c 'import json; print(json.load(open("../.github/build-requests/request.json"))["version"])')"
            test "$version" = "$requested"
            python3 -c 'import json; d=json.load(open("../.github/build-requests/request.json")); assert isinstance(d.get("request_id"),str) and len(d["request_id"]) >= 8'
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version $version (code $code)"
      - name: Build Android release APK
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/pkmn-release.keystore"' EXIT
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pkmn-release.keystore"
          chmod 600 "$RUNNER_TEMP/pkmn-release.keystore"
          keytool -list -keystore "$RUNNER_TEMP/pkmn-release.keystore" -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" >/dev/null
          cordova build android --release -- --packageType=apk \
            --keystore="$RUNNER_TEMP/pkmn-release.keystore" \
            --storePassword="$RELEASE_STORE_PASSWORD" \
            --alias="$RELEASE_KEY_ALIAS" \
            --password="$RELEASE_KEY_PASSWORD"
          apk="platforms/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" | grep -E 'Verifies|Signer #1 certificate SHA-256 digest'
          cp "$apk" PkmnBlockPuzzle.apk
          sha256sum PkmnBlockPuzzle.apk > PkmnBlockPuzzle.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: PkmnBlockPuzzle-release
          path: |
            TetrisApp/PkmnBlockPuzzle.apk
            TetrisApp/PkmnBlockPuzzle.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${{ steps.release_version.outputs.version }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists; refusing to overwrite it"
            exit 1
          fi
          if ! gh api "repos/$GITHUB_REPOSITORY" --jq '.permissions.push' | grep -qx true; then
            echo "::error::Workflow token cannot write releases. Enable Actions > General > Workflow permissions > Read and write permissions, or configure a release PAT with contents:write."
            exit 1
          fi
          gh release create "$tag" \
            PkmnBlockPuzzle.apk PkmnBlockPuzzle.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PkmnBlockPuzzle $tag" \
            --notes "Signed Android release $tag. Check in-app updates for release notes. Android may require installation confirmation."
