name: Android Release APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/build-requests/request.json'

permissions:
  contents: write

jobs:
  android-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: TetrisApp
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: TetrisApp/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify release secrets without printing values
        shell: bash
        run: |
          set -euo pipefail
          for k in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            test -n "${!k}" || { echo "::error::Missing required signing secret: $k"; exit 1; }
          done
      - name: Install dependencies
        run: npm ci
      - name: Install Cordova
        run: npm install --global cordova@12
      - name: Add Android platform
        run: cordova platform add android@14.0.1
      - name: Install external browser bridge
        run: cordova plugin add cordova-plugin-inappbrowser@6.0.0
      - name: Install in-app updater
        run: |
          test -f local-plugins/cordova-plugin-pkmn-updater/package.json
          test -f local-plugins/cordova-plugin-pkmn-updater/plugin.xml
          cordova plugin add ./local-plugins/cordova-plugin-pkmn-updater
      - name: Verify Android updater resource placement
        shell: bash
        run: |
          set -euo pipefail
          resource="platforms/android/app/src/main/res/xml/pkmn_updater_paths.xml"
          source="local-plugins/cordova-plugin-pkmn-updater/src/android/pkmn_updater_paths.xml"
          test -s "$source"
          mkdir -p "$(dirname "$resource")"
          cp "$source" "$resource"
          test -s "$resource"
          echo "Updater FileProvider XML present at: $resource"
      - name: Validate version and authorized build request
        id: release_version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("config.xml").getroot().attrib["version"])')"
          code="$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("config.xml").getroot().attrib["android-versionCode"])')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$code" =~ ^[0-9]+$ ]]
          grep -Fq "v$version</div>" www/index.html
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            requested="$(python3 -c 'import json; print(json.load(open("../.github/build-requests/request.json"))["version"])')"
            test "$version" = "$requested"
            python3 -c 'import json; d=json.load(open("../.github/build-requests/request.json")); assert isinstance(d.get("request_id"),str) and len(d["request_id"]) >= 8'
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version $version (code $code)"
      - name: Build Android release APK
        id: build_apk
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/pkmn-release.keystore"' EXIT
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pkmn-release.keystore"
          chmod 600 "$RUNNER_TEMP/pkmn-release.keystore"
          keytool -list -keystore "$RUNNER_TEMP/pkmn-release.keystore" -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" >/dev/null
          cordova build android --release -- --packageType=apk \
            --keystore="$RUNNER_TEMP/pkmn-release.keystore" \
            --storePassword="$RELEASE_STORE_PASSWORD" \
            --alias="$RELEASE_KEY_ALIAS" \
            --password="$RELEASE_KEY_PASSWORD"
          apk="platforms/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" | grep -E 'Verifies|Signer #1 certificate SHA-256 digest'
          cp "$apk" PkmnBlockPuzzle.apk
          sha256sum PkmnBlockPuzzle.apk > PkmnBlockPuzzle.apk.sha256
      - uses: actions/upload-artifact@v4
        id: upload_apk
        with:
          name: PkmnBlockPuzzle-release
          path: |
            TetrisApp/PkmnBlockPuzzle.apk
            TetrisApp/PkmnBlockPuzzle.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        id: publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${{ steps.release_version.outputs.version }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists; refusing to overwrite it"
            exit 1
          fi
          if ! gh api "repos/$GITHUB_REPOSITORY" --jq '.permissions.push' | grep -qx true; then
            echo "::error::Workflow token cannot write releases. Enable Actions > General > Workflow permissions > Read and write permissions, or configure a release PAT with contents:write."
            exit 1
          fi
          gh release create "$tag" \
            PkmnBlockPuzzle.apk PkmnBlockPuzzle.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PkmnBlockPuzzle $tag" \
            --notes "Signed Android release $tag. Check in-app updates for release notes. Android may require installation confirmation."

      - name: Save build status for ChatGPT inspection
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_RESULT: ${{ steps.release_version.outcome }}
          BUILD_RESULT: ${{ steps.build_apk.outcome }}
          ARTIFACT_RESULT: ${{ steps.upload_apk.outcome }}
          RELEASE_RESULT: ${{ steps.publish_release.outcome }}
          REPORTED_VERSION: ${{ steps.release_version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          report_path=".github/build-status/latest.json"
          mkdir -p "$(dirname "$report_path")"
          python3 - <<'PY'
          import json, os, datetime
          outcomes = {k: os.environ.get(k, "unknown") for k in
                      ("VALIDATION_RESULT", "BUILD_RESULT", "ARTIFACT_RESULT", "RELEASE_RESULT")}
          successful = all(v == "success" for v in outcomes.values())
          data = {
              "schema_version": 1,
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "run_url": f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}',
              "source_sha": os.environ["GITHUB_SHA"],
              "source_ref": os.environ["GITHUB_REF"],
              "version": os.environ.get("REPORTED_VERSION") or "unknown",
              "reported_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "steps": {"version_validation": outcomes["VALIDATION_RESULT"],
                        "apk_build_and_signing": outcomes["BUILD_RESULT"],
                        "artifact_upload": outcomes["ARTIFACT_RESULT"],
                        "release_publish": outcomes["RELEASE_RESULT"]},
              "result": "success" if successful else "failure",
              "release_url": f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/releases/tag/v{os.environ["REPORTED_VERSION"]}' if successful else None
          }
          with open(".github/build-status/latest.json", "w") as f:
              json.dump(data, f, indent=2)
              f.write("\\n")
          PY
          existing_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$report_path?ref=master" --jq .sha 2>/dev/null || true)"
          encoded="$(base64 -w 0 "$report_path")"
          if [[ -n "$existing_sha" ]]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$report_path" \
              -f message="ci: record Android build outcome (run $GITHUB_RUN_ID)" \
              -f content="$encoded" -f sha="$existing_sha" -f branch=master > /dev/null
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$report_path" \
              -f message="ci: record Android build outcome (run $GITHUB_RUN_ID)" \
              -f content="$encoded" -f branch=master > /dev/null
          fi
          echo "Build report saved to $report_path"
