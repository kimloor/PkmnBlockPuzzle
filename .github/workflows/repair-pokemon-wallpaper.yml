name: Repair embedded wallpaper stripe and deploy
on:
  push:
    branches: [master]
    paths:
      - 'scripts/repair-pokemon-wallpaper.py'
      - '.github/workflows/repair-pokemon-wallpaper.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: wallpaper-restoration
  cancel-in-progress: false

jobs:
  repair:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow and NumPy
        run: python -m pip install --disable-pip-version-check pillow numpy
      - name: Remove the embedded tint from original JPEG pixel data
        run: python scripts/repair-pokemon-wallpaper.py
      - name: Invalidate Safari image cache and bump version atomically
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          config=Path('TetrisApp/config.xml')
          original=config.read_text()
          m=re.search(r'version="(\d+)\.(\d+)\.(\d+)" android-versionCode="(\d+)"',original)
          assert m, 'config version missing'
          major,minor,patch,old_code=map(int,m.groups())
          expected_code=major*10000+minor*100+patch
          assert old_code==expected_code, (old_code,expected_code)
          old_version=f'{major}.{minor}.{patch}'
          new_version=f'{major}.{minor}.{patch+1}'
          new_code=major*10000+minor*100+patch+1
          config.write_text(original.replace(m.group(0),f'version="{new_version}" android-versionCode="{new_code}"'))
          print(f'Wallpaper restore version: {old_version} -> {new_version}',flush=True)
          html=Path('TetrisApp/www/index.html')
          s=html.read_text()
          old_css='css/mobile-fix.css?v='+old_version
          old_badge='class="game-version" aria-label="Game version">v'+old_version
          assert s.count(old_css)==1,(old_css,s.count(old_css))
          assert s.count(old_badge)==1,(old_badge,s.count(old_badge))
          html.write_text(s.replace(old_css,'css/mobile-fix.css?v='+new_version)
                           .replace(old_badge,'class="game-version" aria-label="Game version">v'+new_version))
          css=Path('TetrisApp/www/css/mobile-fix.css')
          source=css.read_text()
          for basename in ('pokemon_bg_mobile.jpg','pokemon_bg_desktop.jpg'):
              old=basename+'")'
              new=basename+'?v='+new_version+'")'
              assert old in source, basename
              source=source.replace(old,new)
          css.write_text(source)
          changelog=Path('CHANGELOG.md')
          s=changelog.read_text()
          changelog.write_text(s.replace('## [Unreleased]',
            '## [Unreleased]\n\n## ['+new_version+'] — Embedded wallpaper stripe restoration (2026-10-30)\n'
            '- Reverse-alpha corrected the rectangular pale overlay in both JPEG backgrounds without redrawing artwork.\n'
            '- Measured reduced edge seam; original JPEG dimensions kept; Safari image URLs cache-busted.\n'
            '- Code and web deployment verified separately; Android APK not built.\n',1))
          roadmap=Path('ROADMAP.md')
          s=roadmap.read_text()
          roadmap.write_text(s.replace('## Safari background correction and larger portrait board',
             '## Safari corrected wallpaper + larger portrait board — source '+new_version+'\n\n'
             '**Asset processing: completed in GitHub Actions. Safari device visual acceptance pending.**\n\n'
             '## Safari background correction and larger portrait board',1))
          PY
      - name: Test source, restored image validity and formatting
        run: |
          node --test tests/pikachu-responsive.test.cjs
          git diff --check
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          for filename in ('pokemon_bg_mobile.jpg','pokemon_bg_desktop.jpg'):
              path=Path('TetrisApp/www/images/pokemon/backgrounds')/filename
              with Image.open(path) as img:
                  img.verify()
          print('JPEG validation PASS')
          PY
      - name: Commit corrected assets and source version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TetrisApp/www/images/pokemon/backgrounds/pokemon_bg_mobile.jpg \
                  TetrisApp/www/images/pokemon/backgrounds/pokemon_bg_desktop.jpg \
                  TetrisApp/www/css/mobile-fix.css TetrisApp/www/index.html \
                  TetrisApp/config.xml CHANGELOG.md ROADMAP.md
          git diff --cached --check
          git commit -m "fix: remove baked wallpaper stripes and refresh Safari cache"
          git push origin HEAD:master
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: TetrisApp/www
      - name: Deploy the restored web game
        uses: actions/deploy-pages@v4
